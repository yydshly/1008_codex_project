<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">UP · 学习与成长行动图</title>
<desc id="map-desc">研究归纳：用真实任务学习，用证据判断成长。三类能力为英语、AI与真实项目、生活与长期成长。六步行动为定义任务、保存首版、定向练习、接受反馈、复测迁移、更新状态。五项价值观为真实、诚实、主体性、可持续、负责。</desc>
