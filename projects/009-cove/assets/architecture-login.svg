<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">Cove：登录与会话</title><desc id="desc">登录创建会话；后续读取用户走 getSession。第三方登录需要自己的 OAuth 配置。。固定提交 e7d40d524b6526d80c803fd092f6fa8bf2029f8e；原创源码解读。</desc><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#152438}.group-label{font-size:13px;fill:#637286}.node-title{font-size:15px;font-weight:600}.node-sub{font-size:12px;fill:#607187}path{fill:none;stroke:#8b9faf;stroke-width:1.6}path.dashed{stroke-dasharray:5 4}path+text{font-size:12px;fill:#587080;paint-order:stroke;stroke:white;stroke-width:4px}.title{font-size:24px;font-weight:700}.caption{font-size:14px;fill:#56667a}</style><rect width="100%" height="100%" fill="white"/><text class="title" x="25" y="35">Cove · 登录与会话</text><text class="caption" x="25" y="64">登录创建会话；后续读取用户走 getSession。第三方登录需要自己的 OAuth 配置。</text><g transform="translate(0 80)"><rect x="20" y="15" width="960" height="165" rx="8" fill="#f1f6fb" stroke="#d7e2eb"/><text x="36" y="38" class="group-label">浏览器 · 用户发起登录</text><rect x="20" y="235" width="960" height="160" rx="8" fill="#edf7f4" stroke="#c8e4db"/><text x="36" y="258" class="group-label">服务端 · 认证请求与第三方交换</text><rect x="20" y="445" width="960" height="180" rx="8" fill="#f4f2fa" stroke="#dbd7e9"/><text x="36" y="468" class="group-label">状态 · 浏览器 Cookie 与数据库记录</text><defs><marker id="arrow-login-export" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" style="fill:#8b9faf;stroke:none"/></marker></defs><path d="M245 110 H340" class="solid" marker-end="url(#arrow-login-export)" /><path d="M450 155 V285" class="solid" marker-end="url(#arrow-login-export)" /><text x="450" y="218" text-anchor="middle">认证请求</text><path d="M560 326 H620" class="solid" marker-end="url(#arrow-login-export)" /><path d="M840 312 H980 V110 H960" class="solid" marker-end="url(#arrow-login-export)" /><text x="867" y="215" text-anchor="middle">可选 OAuth 回调</text><path d="M730 370 V416 H530 V490" class="solid" marker-end="url(#arrow-login-export)" /><text x="626" y="408" text-anchor="middle">写入 / 查询</text><path d="M640 538 H740" class="solid" marker-end="url(#arrow-login-export)" /><path d="M620 344 H295 V538 H260" class="solid" marker-end="url(#arrow-login-export)" /><text x="285" y="420" text-anchor="middle">Set-Cookie 响应</text><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/routes/_guest/login.tsx"><rect x="40" y="65" width="205" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="54" y="108" class="node-title">登录 / 注册表单</text><text x="54" y="130" class="node-sub">邮箱、密码、姓名</text><title>登录和注册页面位于 _guest 布局下。页面已有提交状态、错误通知和注册密码确认。注册成功清除 auth 查询缓存并导航到 /app；登录传递 callbackURL。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/auth-client.ts"><rect x="340" y="65" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="354" y="108" class="node-title">authClient</text><text x="354" y="130" class="node-sub">signIn.email / signUp.email</text><title>浏览器客户端发送认证请求。邮箱密码与社交登录最终都由服务端 Better Auth 处理。客户端从不直接连接 PostgreSQL。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/routes/api/auth/$.ts"><rect x="340" y="285" width="220" height="85" rx="7" fill="white" stroke="#b7c9d7" /><text x="354" y="325.5" class="node-title">/api/auth/*</text><text x="354" y="347.5" class="node-sub">认证路由分发</text><title>通配路由把原始 Request 交给 auth.handler。Cove 没有自己重新实现密码算法或 OAuth 协议；这些由 Better Auth 完成。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/auth.ts"><rect x="620" y="285" width="220" height="85" rx="7" fill="white" stroke="#b7c9d7" /><text x="634" y="325.5" class="node-title">Better Auth</text><text x="634" y="347.5" class="node-sub">创建用户、账户、会话</text><title>邮箱密码认证已启用。认证配置包含 GitHub 和 Google provider；必须设置凭据和正确的回调地址。模板未配置发送验证邮件、密码重置邮件或 MFA，相关功能需另行接入。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/components/sign-in-social-buttons.tsx"><rect x="740" y="65" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="754" y="108" class="node-title">GitHub / Google</text><text x="754" y="130" class="node-sub">可选 OAuth 分支</text><title>社交登录在浏览器跳转、服务端回调与第三方令牌交换之间完成。模板演示站禁用 Google 按钮；自己的部署需配置 provider 凭据，不能把示例按钮当作已经可用的服务。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/auth.ts"><rect x="40" y="490" width="220" height="95" rx="7" fill="white" stroke="#b7c9d7" /><text x="54" y="535.5" class="node-title">浏览器 Cookie</text><text x="54" y="557.5" class="node-sub">随同源请求发送</text><title>认证响应设置 Cookie；后续请求携带 Cookie。tanstackStartCookies 协助服务器函数转发 Cookie，_getUser 也明确转发 getSession 的 Set-Cookie。默认 Cookie 会话缓存五分钟，以较短时间内的状态新鲜度换取更少数据库查询。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/auth.ts"><rect x="420" y="490" width="220" height="95" rx="7" fill="white" stroke="#b7c9d7" /><text x="434" y="535.5" class="node-title">Drizzle adapter</text><text x="434" y="557.5" class="node-sub">认证记录持久化</text><title>Better Auth 通过 PostgreSQL 的 Drizzle 适配器读写认证数据。账号身份、会话与数据库用户记录关联；不是把密码或数据库连接交给浏览器。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/db/schema/auth.schema.ts"><rect x="740" y="490" width="220" height="95" rx="7" fill="white" stroke="#b7c9d7" /><text x="754" y="535.5" class="node-title">认证数据表</text><text x="754" y="557.5" class="node-sub">user / session / account</text><title>会话与账户通过 userId 外键关联用户。查询用户时可以访问数据库，也可能由 Cookie 缓存返回。敏感操作可使用 freshAuthMiddleware 跳过缓存，但仍需检查业务权限。</title></a></g><text class="caption" x="25" y="808">研究 009 · 2026-10-09 · e7d40d5 · 实线为已有关系；虚线为需要接入的中间件</text></svg>