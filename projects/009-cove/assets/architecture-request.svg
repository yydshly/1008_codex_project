<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">Cove：页面与数据请求</title><desc id="desc">以访问 /app 为例：首次 SSR 与后续导航共享路由和查询定义，但执行位置不同。。固定提交 e7d40d524b6526d80c803fd092f6fa8bf2029f8e；原创源码解读。</desc><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#152438}.group-label{font-size:13px;fill:#637286}.node-title{font-size:15px;font-weight:600}.node-sub{font-size:12px;fill:#607187}path{fill:none;stroke:#8b9faf;stroke-width:1.6}path.dashed{stroke-dasharray:5 4}path+text{font-size:12px;fill:#587080;paint-order:stroke;stroke:white;stroke-width:4px}.title{font-size:24px;font-weight:700}.caption{font-size:14px;fill:#56667a}</style><rect width="100%" height="100%" fill="white"/><text class="title" x="25" y="35">Cove · 页面与数据请求</text><text class="caption" x="25" y="64">以访问 /app 为例：首次 SSR 与后续导航共享路由和查询定义，但执行位置不同。</text><g transform="translate(0 80)"><rect x="20" y="15" width="960" height="165" rx="8" fill="#edf7f4" stroke="#c8e4db"/><text x="36" y="38" class="group-label">首次访问 · 服务器准备页面</text><rect x="20" y="230" width="960" height="160" rx="8" fill="#f4f2fa" stroke="#dbd7e9"/><text x="36" y="253" class="group-label">认证数据 · 服务端执行</text><rect x="20" y="440" width="960" height="190" rx="8" fill="#f1f6fb" stroke="#d7e2eb"/><text x="36" y="463" class="group-label">返回浏览器 · 继续交互</text><defs><marker id="arrow-request-export" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" style="fill:#8b9faf;stroke:none"/></marker></defs><path d="M260 110 H390" class="solid" marker-end="url(#arrow-request-export)" /><path d="M610 110 H740" class="solid" marker-end="url(#arrow-request-export)" /><path d="M850 155 V280" class="solid" marker-end="url(#arrow-request-export)" /><text x="850" y="213" text-anchor="middle">服务器函数</text><path d="M740 325 H610" class="solid" marker-end="url(#arrow-request-export)" /><path d="M390 325 H260" class="solid" marker-end="url(#arrow-request-export)" /><path d="M150 370 V490" class="solid" marker-end="url(#arrow-request-export)" /><text x="150" y="424" text-anchor="middle">准备 SSR 结果</text><path d="M260 535 H390" class="solid" marker-end="url(#arrow-request-export)" /><path d="M610 535 H740" class="solid" marker-end="url(#arrow-request-export)" /><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/routes/_auth/app/index.tsx"><rect x="40" y="65" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="54" y="108" class="node-title">访问 /app</text><text x="54" y="130" class="node-sub">首次请求到服务器</text><title>浏览器首次请求 /app 时由 Start 处理 HTML 页面。后续客户端导航也会运行 beforeLoad，因此路由逻辑并不是永久只在服务器运行。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/routes/_auth/route.tsx"><rect x="390" y="65" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="404" y="108" class="node-title">_auth.beforeLoad</text><text x="404" y="130" class="node-sub">查询当前用户；决定跳转</text><title>路由使用 queryClient.query(authQueryOptions())。它先优先读取缓存，再触发常规查询；拿不到用户时跳转 /login。这是导航和展示控制，不是保护所有服务器数据的安全边界。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/queries.ts"><rect x="740" y="65" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="754" y="108" class="node-title">authQueryOptions</text><text x="754" y="130" class="node-sub">统一 queryKey: [&quot;auth&quot;]</text><title>queryFn 调用 $getUser，useAuth 与 useAuthSuspense 复用相同查询键。相同数据由 Query 统一缓存与去重，减少布局和页面重复请求。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/functions.ts"><rect x="740" y="280" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="754" y="323" class="node-title">$getUser → _getUser</text><text x="754" y="345" class="node-sub">SSR 直接调用 / 浏览器 RPC</text><title>$getUser 用 createServerFn 定义 GET 请求，_getUser 用 createServerOnlyFn 限制服务端执行。构建时服务器函数在客户端变为 RPC 代理，具体认证逻辑留在服务器。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/functions.ts"><rect x="390" y="280" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="404" y="323" class="node-title">auth.api.getSession</text><text x="404" y="345" class="node-sub">请求头 → 会话 → user | null</text><title>_getUser 获取当前请求 headers 调用 getSession，转发响应 Set-Cookie，最后返回 session.response?.user || null。模板对外暴露用户信息，未把完整会话和 OAuth 令牌返回给组件。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/auth.ts"><rect x="40" y="280" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="54" y="323" class="node-title">会话缓存 / 数据库</text><text x="54" y="345" class="node-sub">Cookie 缓存命中可少查库</text><title>Better Auth 可使用五分钟 Cookie 缓存减少服务端访问数据库。freshAuthMiddleware 关闭该缓存，要求从数据库读取当前会话。Query 的客户端数据缓存与此处的会话缓存是不同的两层。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/router.tsx"><rect x="40" y="490" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="54" y="533" class="node-title">HTML + 查询状态</text><text x="54" y="555" class="node-sub">SSR 数据衔接</text><title>setupRouterSsrQueryIntegration 连接 Router 与 Query，支持 SSR 查询状态传递和重定向。首屏在服务器渲染，随后浏览器恢复查询状态并接管交互。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/routes/_auth/app/index.tsx"><rect x="390" y="490" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="404" y="533" class="node-title">useAuthSuspense</text><text x="404" y="555" class="node-sub">显示当前用户</text><title>默认 /app 页面只展示当前登录用户和布局路径。它是认证示例页，不包含项目列表、订单或管理后台。这些业务页面由开发者替换和扩充。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/routes/_guest/signup.tsx"><rect x="740" y="490" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="754" y="533" class="node-title">后续浏览器导航</text><text x="754" y="555" class="node-sub">读取缓存 · 按需重新请求</text><title>浏览器导航复用 Router 与 Query。注册成功移除 auth 缓存并导航；退出将 auth 缓存设为 null 并 invalidate Router。新增业务修改后，也需要正确更新或失效相关查询。</title></a></g><text class="caption" x="25" y="768">研究 009 · 2026-10-09 · e7d40d5 · 实线为已有关系；虚线为需要接入的中间件</text></svg>