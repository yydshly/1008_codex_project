<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc"><title id="title">Cove：模板全局架构</title><desc id="desc">浏览器与服务器各负其责；认证请求和服务器函数走两条不同的入口。。固定提交 e7d40d524b6526d80c803fd092f6fa8bf2029f8e；原创源码解读。</desc><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#152438}.group-label{font-size:13px;fill:#637286}.node-title{font-size:15px;font-weight:600}.node-sub{font-size:12px;fill:#607187}path{fill:none;stroke:#8b9faf;stroke-width:1.6}path.dashed{stroke-dasharray:5 4}path+text{font-size:12px;fill:#587080;paint-order:stroke;stroke:white;stroke-width:4px}.title{font-size:24px;font-weight:700}.caption{font-size:14px;fill:#56667a}</style><rect width="100%" height="100%" fill="white"/><text class="title" x="25" y="35">Cove · 模板全局架构</text><text class="caption" x="25" y="64">浏览器与服务器各负其责；认证请求和服务器函数走两条不同的入口。</text><g transform="translate(0 80)"><rect x="20" y="15" width="960" height="165" rx="8" fill="#f1f6fb" stroke="#d7e2eb"/><text x="36" y="38" class="group-label">浏览器 · 交互与客户端状态</text><rect x="20" y="225" width="960" height="310" rx="8" fill="#edf7f4" stroke="#c8e4db"/><text x="36" y="248" class="group-label">服务器 · TanStack Start / Nitro</text><rect x="20" y="580" width="960" height="120" rx="8" fill="#f4f2fa" stroke="#dbd7e9"/><text x="36" y="603" class="group-label">数据持久化 · PostgreSQL</text><defs><marker id="arrow-system-export" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" style="fill:#8b9faf;stroke:none"/></marker></defs><path d="M245 110 H280" class="solid" marker-end="url(#arrow-system-export)" /><path d="M485 110 H520" class="solid" marker-end="url(#arrow-system-export)" /><path d="M382 155 V202 H142 V280" class="solid" marker-end="url(#arrow-system-export)" /><text x="253" y="198" text-anchor="middle">首次访问 / HTML</text><path d="M622 155 V280" class="solid" marker-end="url(#arrow-system-export)" /><text x="622" y="212" text-anchor="middle">调用服务器函数</text><path d="M860 155 V280" class="solid" marker-end="url(#arrow-system-export)" /><text x="860" y="212" text-anchor="middle">认证 HTTP</text><path d="M245 325 H520" class="solid" marker-end="url(#arrow-system-export)" /><text x="382" y="315" text-anchor="middle">SSR 内部调用</text><path d="M622 370 V404 H740 V435" class="solid" marker-end="url(#arrow-system-export)" /><text x="684" y="396" text-anchor="middle">_getUser</text><path d="M860 370 V475 H840" class="solid" marker-end="url(#arrow-system-export)" /><path d="M520 344 H384 V435" class="dashed" marker-end="url(#arrow-system-export)" /><text x="381" y="395" text-anchor="middle">显式挂载</text><path d="M490 475 H640" class="solid" marker-end="url(#arrow-system-export)" /><path d="M740 515 V558 H500 V620" class="solid" marker-end="url(#arrow-system-export)" /><text x="620" y="550" text-anchor="middle">Drizzle adapter</text><path d="M610 652 H685" class="solid" marker-end="url(#arrow-system-export)" /><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/routes/__root.tsx"><rect x="40" y="65" width="205" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="54" y="108" class="node-title">React 页面与 UI</text><text x="54" y="130" class="node-sub">表单 · 主题 · 通知</text><title>React 渲染页面。Tailwind CSS、shadcn/ui 与 Base UI 构成基础界面；ThemeProvider 将主题偏好保存在浏览器 localStorage。页面首次也会参与 SSR，因此 UI 不等于仅在浏览器执行。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/router.tsx"><rect x="280" y="65" width="205" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="294" y="108" class="node-title">TanStack Router</text><text x="294" y="130" class="node-sub">文件路由 · 导航 · 预加载</text><title>由 src/routes 文件生成 routeTree.gen.ts。Router 在 SSR 和浏览器导航中都使用；_auth、_guest 是不出现在 URL 中的布局路由。默认 intent 预加载根据用户交互意图提前准备页面。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/router.tsx"><rect x="520" y="65" width="205" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="534" y="108" class="node-title">TanStack Query</text><text x="534" y="130" class="node-sub">请求去重 · 缓存 · 重验证</text><title>QueryClient 管理服务器数据，不是数据库。普通查询默认 staleTime 为两分钟；认证路由优先读取缓存，再触发查询。setupRouterSsrQueryIntegration 将服务端查询状态与浏览器衔接。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/auth-client.ts"><rect x="760" y="65" width="200" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="774" y="108" class="node-title">Better Auth Client</text><text x="774" y="130" class="node-sub">注册 · 登录 · 退出</text><title>createAuthClient 面向浏览器事件处理。登录表单调用 signIn.email，注册表单调用 signUp.email，社交按钮调用 signIn.social。这些请求走 /api/auth/*，与 $getUser 服务器函数的入口不同。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/vite.config.ts"><rect x="40" y="280" width="205" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="54" y="323" class="node-title">Start 页面入口</text><text x="54" y="345" class="node-sub">SSR HTML · 水合</text><title>首次请求在服务器加载路由、执行数据准备并渲染 HTML；浏览器加载代码后接管交互。路由加载逻辑也可以在浏览器运行，访问私有后端资源须经服务器函数或 API。Nitro 承载服务器运行和请求处理。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/functions.ts"><rect x="520" y="280" width="205" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="534" y="323" class="node-title">$getUser / Server Fn</text><text x="534" y="345" class="node-sub">客户端 RPC · SSR 直接调用</text><title>已实现的 $getUser 是 GET 服务器函数，内部调用 _getUser 获取当前用户。客户端调用会发网络请求；在服务器执行时直接运行服务器实现。业务服务器函数是后续扩展点，不能因为处于 _auth 页面就自动获得鉴权。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/routes/api/auth/$.ts"><rect x="760" y="280" width="200" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="774" y="323" class="node-title">/api/auth/*</text><text x="774" y="345" class="node-sub">GET / POST → auth.handler</text><title>src/routes/api/auth/$.ts 是通配 API 路由，GET 和 POST 均委托给 Better Auth。注册、登录、退出及 OAuth 回调由认证库处理；这里不是通用业务 API。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/middleware.ts"><rect x="280" y="435" width="210" height="80" rx="7" fill="white" stroke="#b7c9d7" stroke-dasharray="5 4"/><text x="294" y="473" class="node-title">鉴权中间件</text><text x="294" y="495" class="node-sub">业务函数需要显式接入</text><title>模板提供 authMiddleware 与 freshAuthMiddleware 两个可复用中间件。前者使用会话缓存；后者设置 disableCookieCache: true，重新查询会话。它们把 user 放入服务器上下文；业务角色、数据归属仍需开发者校验。图中虚线表示提供但需挂载。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/auth.ts"><rect x="640" y="435" width="200" height="80" rx="7" fill="white" stroke="#b7c9d7" /><text x="654" y="473" class="node-title">Better Auth Server</text><text x="654" y="495" class="node-sub">会话验证 · Cookie 缓存</text><title>服务端 auth 实例配置邮箱密码、GitHub / Google provider、tanstackStartCookies 和 PostgreSQL 适配器。_getUser 读取请求头调用 auth.api.getSession，并转发 Set-Cookie。默认会话 Cookie 缓存五分钟，减少访问数据库。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/db/index.ts"><rect x="390" y="620" width="220" height="65" rx="7" fill="white" stroke="#b7c9d7" /><text x="404" y="650.5" class="node-title">Drizzle + postgres-js</text><text x="404" y="672.5" class="node-sub">类型化查询与认证适配器</text><title>postgres(ENV.DATABASE_URL) 创建数据库客户端，Drizzle 使用 relations v2。Better Auth 通过 drizzleAdapter 访问认证表。数据库模块声明 server-only，不能当作浏览器模块导入。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/db/schema/auth.schema.ts"><rect x="685" y="620" width="275" height="65" rx="7" fill="white" stroke="#b7c9d7" /><text x="699" y="650.5" class="node-title">PostgreSQL</text><text x="699" y="672.5" class="node-sub">user · session · account · verification</text><title>模板只定义认证相关表。user 保存用户信息，session 保存会话，account 保存认证账户与凭据相关字段，verification 保存验证记录。自己的项目、笔记、订单等表需要新增；verification 表存在不代表验证邮件已经接通。</title></a></g><text class="caption" x="25" y="828">研究 009 · 2026-10-09 · e7d40d5 · 实线为已有关系；虚线为需要接入的中间件</text></svg>