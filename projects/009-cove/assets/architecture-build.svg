<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">Cove：构建与部署</title><desc id="desc">Vite+ 组织工具链，Start 分离执行边界，Nitro 生成服务器产物与部署适配。。固定提交 e7d40d524b6526d80c803fd092f6fa8bf2029f8e；原创源码解读。</desc><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#152438}.group-label{font-size:13px;fill:#637286}.node-title{font-size:15px;font-weight:600}.node-sub{font-size:12px;fill:#607187}path{fill:none;stroke:#8b9faf;stroke-width:1.6}path.dashed{stroke-dasharray:5 4}path+text{font-size:12px;fill:#587080;paint-order:stroke;stroke:white;stroke-width:4px}.title{font-size:24px;font-weight:700}.caption{font-size:14px;fill:#56667a}</style><rect width="100%" height="100%" fill="white"/><text class="title" x="25" y="35">Cove · 构建与部署</text><text class="caption" x="25" y="64">Vite+ 组织工具链，Start 分离执行边界，Nitro 生成服务器产物与部署适配。</text><g transform="translate(0 80)"><rect x="20" y="15" width="960" height="165" rx="8" fill="#f1f6fb" stroke="#d7e2eb"/><text x="36" y="38" class="group-label">开发输入与构建配置</text><rect x="20" y="230" width="960" height="160" rx="8" fill="#edf7f4" stroke="#c8e4db"/><text x="36" y="253" class="group-label">构建输出 · 浏览器包与服务器包</text><rect x="20" y="440" width="960" height="190" rx="8" fill="#f4f2fa" stroke="#dbd7e9"/><text x="36" y="463" class="group-label">运行环境 · 静态资源 + 服务器 + PostgreSQL</text><defs><marker id="arrow-build-export" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" style="fill:#8b9faf;stroke:none"/></marker></defs><path d="M260 110 H390" class="solid" marker-end="url(#arrow-build-export)" /><path d="M610 110 H740" class="solid" marker-end="url(#arrow-build-export)" /><path d="M850 155 V208 H305 V280" class="solid" marker-end="url(#arrow-build-export)" /><text x="477" y="201" text-anchor="middle">客户端构建</text><path d="M850 155 V245 H695 V280" class="solid" marker-end="url(#arrow-build-export)" /><text x="840" y="237" text-anchor="middle">服务端构建</text><path d="M305 370 V490" class="solid" marker-end="url(#arrow-build-export)" /><path d="M695 370 V490" class="solid" marker-end="url(#arrow-build-export)" /><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/.env.schema"><rect x="40" y="65" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="54" y="108" class="node-title">源码与配置</text><text x="54" y="130" class="node-sub">routes · schema · .env.schema</text><title>src/routes 定义页面和 API，src/lib 保存认证与数据库模块。Varlock 读取 .env.schema 的变量约束，生成类型并校验本地值。开发者在未提交的 .env.local 中设置实际配置。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/package.json"><rect x="390" y="65" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="404" y="108" class="node-title">Vite+ 工具链</text><text x="404" y="130" class="node-sub">dev · build · check · test</text><title>vp dev / build 提供开发与构建入口，Oxlint / Oxfmt 负责检查和格式化，Vitest 与 Playwright 提供测试基础。现有测试是轻量示例，自己的业务规则和关键流程需要补充验证。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/vite.config.ts"><rect x="740" y="65" width="220" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="754" y="108" class="node-title">构建插件</text><text x="754" y="130" class="node-sub">Start · Nitro · React · Tailwind</text><title>vite.config.ts 集成 tanstackStart、nitro、viteReact compiler、tailwindcss、Varlock 和 Devtools。Start 按执行环境处理服务器函数；Nitro 负责服务器运行与部署产物。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/src/lib/auth/auth.ts"><rect x="180" y="280" width="250" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="194" y="323" class="node-title">浏览器产物</text><text x="194" y="345" class="node-sub">页面代码 · CSS · RPC 代理</text><title>客户端包含交互页面、样式和调用服务器函数的网络代理。auth.ts 与 db/index.ts 明确声明 server-only；数据库连接、认证密钥和服务端实现不应进入浏览器包。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/package.json"><rect x="570" y="280" width="250" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="584" y="323" class="node-title">服务器产物</text><text x="584" y="345" class="node-sub">SSR · Server Fn · API · 日志</text><title>Node 启动脚本执行 .output/server/index.mjs。Nitro 配置集成 evlog，请求日志可接后端投递器；服务端需要实际环境变量、数据库连接和部署运行环境。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/README.md"><rect x="180" y="490" width="250" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="194" y="533" class="node-title">浏览器 / 静态资源服务</text><text x="194" y="555" class="node-sub">访问 HTML 与 JS / CSS</text><title>浏览器接收页面 HTML 并加载交互资源。静态资源可以由部署平台提供，但完整 Cove 应用的登录、SSR 和数据库操作仍需要服务端。</title></a><a href="https://github.com/mugnavo/cove/blob/e7d40d524b6526d80c803fd092f6fa8bf2029f8e/README.md"><rect x="570" y="490" width="250" height="90" rx="7" fill="white" stroke="#b7c9d7" /><text x="584" y="533" class="node-title">Nitro 运行 / 部署适配</text><text x="584" y="555" class="node-sub">Node.js · 平台 preset</text><title>README 列出 Node.js、Netlify、Vercel 等 Nitro 部署目标。选择 preset 并不自动创建数据库、OAuth 应用或密钥。固定模板使用 Nitro v3 beta 与 Drizzle v1 RC，应按实际目标验证兼容性。</title></a></g><text class="caption" x="25" y="768">研究 009 · 2026-10-09 · e7d40d5 · 实线为已有关系；虚线为需要接入的中间件</text></svg>